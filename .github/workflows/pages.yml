name: Validate and deploy (GitHub Pages)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pdftotext
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - name: protocols.json is in sync with tools/build_protocols.py
        run: python3 tools/build_protocols.py && git diff --exit-code data/protocols.json
      - name: Structural validation (reachability, edges, sources, issue IDs)
        run: python3 tools/validate_protocols.py
      - name: Fidelity against source PDFs
        run: python3 tools/check_fidelity.py
      - name: Engine path tests (every path, both allergy states)
        run: node tools/test_engine.mjs

  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          mkdir _site
          cp -r index.html manifest.json sw.js css js data assets _site/
          sed -i "s/^const VERSION = \"dev\";/const VERSION = \"${GITHUB_SHA::8}\";/" _site/sw.js
          grep -q "${GITHUB_SHA::8}" _site/sw.js
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
